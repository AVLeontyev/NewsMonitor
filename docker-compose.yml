networks:
  newsmonitor-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  elasticsearch-data:

services:
  # PostgreSQL
  postgres:
    image: postgres:15
    container_name: newsmonitor-postgres
    environment:
      POSTGRES_DB: newsmonitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - newsmonitor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: newsmonitor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: newsuser
      RABBITMQ_DEFAULT_PASS: newspassword
      RABBITMQ_DEFAULT_VHOST: newsmonitor
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - newsmonitor-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: newsmonitor-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - newsmonitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana
  kibana:
    image: kibana:8.11.0
    container_name: newsmonitor-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=somethingatleast32characterslong
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - newsmonitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API
  api:
    build:
      context: .
      dockerfile: src/NewsMonitor.API/Dockerfile
    container_name: newsmonitor-api
    ports:
      - "5269:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=newsmonitor;User Id=postgres;Password=postgres;SSL Mode=Disable;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=newsuser
      - RabbitMQ__Password=newspassword
      - RabbitMQ__VirtualHost=newsmonitor
      - Elasticsearch__Uri=http://elasticsearch:9200
    networks:
      - newsmonitor-network
    restart: unless-stopped

  # Parser
  parser:
    build:
      context: .
      dockerfile: src/NewsMonitor.Parser/Dockerfile
    container_name: newsmonitor-parser
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=newsmonitor;User Id=postgres;Password=postgres;SSL Mode=Disable;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=newsuser
      - RabbitMQ__Password=newspassword
      - RabbitMQ__VirtualHost=newsmonitor
      - Elasticsearch__Uri=http://elasticsearch:9200
    networks:
      - newsmonitor-network
    restart: unless-stopped

  # Consumer
  consumer:
    build:
      context: .
      dockerfile: src/NewsMonitor.Consumer/Dockerfile
    container_name: newsmonitor-consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=newsuser
      - RabbitMQ__Password=newspassword
      - RabbitMQ__VirtualHost=newsmonitor
      - Elasticsearch__Uri=http://elasticsearch:9200
    networks:
      - newsmonitor-network
    restart: unless-stopped

  # Pgadmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: newsmonitor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@newsmonitor.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - newsmonitor-network
    restart: unless-stopped